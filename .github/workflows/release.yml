name: Release (sign + publish)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach artifacts to a Release
  id-token: write

jobs:
  build-and-sign:
    name: Build, sign with SignPath, publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK 11
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Workaround infverif path layout
        shell: pwsh
        run: |
          $bases = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22000.0",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0"
          )
          foreach ($b in $bases) {
            if (Test-Path "$b\x86" -and -not (Test-Path "$b\x86\x86")) {
              New-Item -ItemType Directory -Path "$b\x86\x86" -Force | Out-Null
              if (Test-Path "$b\x86\infverif.dll") {
                Copy-Item "$b\x86\infverif.dll" "$b\x86\x86\" -Force
              }
            }
          }

      - name: Build solution
        shell: cmd
        run: msbuild ODaAudioDriver.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Upload unsigned package
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: ODaAudioDriver-unsigned-x64
          path: |
            x64/Release/package/ODaAudioDriver.sys
            x64/Release/package/ODaAudioDriver.inf
            x64/Release/package/odaaudiodriver.cat
          if-no-files-found: error
          retention-days: 14

      # SignPath sign step (skipped automatically until secrets/vars are configured).
      - name: Submit signing request to SignPath
        id: signpath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORG_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            Release_Tag: ${{ github.ref_name }}

      - name: Upload signed package
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ODaAudioDriver-signed-x64
          path: |
            signed/ODaAudioDriver.sys
            signed/ODaAudioDriver.inf
            signed/odaaudiodriver.cat
          if-no-files-found: error
          retention-days: 90

      - name: Attach signed binaries to GitHub Release
        if: steps.signpath.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/ODaAudioDriver.sys
            signed/ODaAudioDriver.inf
            signed/odaaudiodriver.cat
          generate_release_notes: true
