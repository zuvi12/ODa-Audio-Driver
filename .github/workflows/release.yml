name: Release (sign + publish)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach artifacts to a Release
  id-token: write

jobs:
  build-and-sign:
    name: Build, sign with SignPath, publish
    runs-on: windows-2022   # has WDK 22H2 + VS 2022 pre-installed; windows-latest moved to 2025 which removed WDK
    timeout-minutes: 45
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: cmd
        run: msbuild ODaAudioDriver.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Upload unsigned package
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: ODaAudioDriver-unsigned-x64
          path: |
            x64/Release/package/ODaAudioDriver.sys
            x64/Release/package/ODaAudioDriver.inf
            x64/Release/package/odaaudiodriver.cat
          if-no-files-found: error
          retention-days: 14

      # SignPath sign step (skipped automatically until secrets/vars are configured).
      - name: Submit signing request to SignPath
        id: signpath
        if: env.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORG_ID != '' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            Release_Tag: ${{ github.ref_name }}

      - name: Upload signed package
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ODaAudioDriver-signed-x64
          path: |
            signed/ODaAudioDriver.sys
            signed/ODaAudioDriver.inf
            signed/odaaudiodriver.cat
          if-no-files-found: error
          retention-days: 90

      - name: Attach signed binaries to GitHub Release
        if: steps.signpath.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/ODaAudioDriver.sys
            signed/ODaAudioDriver.inf
            signed/odaaudiodriver.cat
          generate_release_notes: true
