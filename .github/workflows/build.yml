name: Build (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-2022   # has WDK 22H2 + VS 2022 pre-installed; windows-latest moved to 2025 which removed WDK
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show pre-installed WDK
        shell: pwsh
        run: |
          Write-Host "=== Looking for portcls.h ==="
          Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Include" -Filter portcls.h -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== WDK installed roots ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue | Select-Object Name

      - name: Build solution
        shell: cmd
        run: msbuild ODaAudioDriver.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: ODaAudioDriver-unsigned-x64
          path: |
            x64/Release/package/ODaAudioDriver.sys
            x64/Release/package/ODaAudioDriver.inf
            x64/Release/package/odaaudiodriver.cat
          if-no-files-found: error
          retention-days: 14
